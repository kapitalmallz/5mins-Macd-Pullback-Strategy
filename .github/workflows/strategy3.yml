name: Strategy 3 - 5m Scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore signal log cache
        uses: actions/cache@v4  # Updated line
        with:
          path: signals_log.json
          key: signal-log-v1

      - name: Install dependencies
        run: pip install yfinance pandas requests pytz

      - name: Run strategy script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python strategy3.py

      - name: Save signal log cache
        uses: actions/cache@v4  # Updated line
        with:
          path: signals_log.json
          key: signal-log-v1
